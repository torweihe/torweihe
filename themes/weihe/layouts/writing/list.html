{{ define "main" }}
<p style="font-size:25.5px; color: var(--muted); font-style: italic; margin-bottom:3.5rem;">Essays, commentary, and occasional longer pieces — in Faroese and English mostly.</p>
<ul class="blog-list">
  {{ range .Pages.ByDate.Reverse }}
  <li class="blog-item">
    <a class="blog-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="blog-date">{{ .Date.Format "Jan 2006" }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
